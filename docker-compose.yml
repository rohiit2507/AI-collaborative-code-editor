services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codecollab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codecollab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_SSL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codecollab}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      YJS_URL: ${YJS_URL:-ws://localhost:1234}
      EXECUTION_VOLUME: ai-collaborative-code-editor_execution_data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - execution_data:/execution
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  migrate:
    build: ./backend
    command: ["node", "src/migrate.js"]
    environment:
      NODE_ENV: production
      DB_SSL: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codecollab}
    depends_on:
      postgres:
        condition: service_healthy

  yjs:
    build: ./backend
    command: ["node", "src/yjsServer.js"]
    environment:
      NODE_ENV: production
      YJS_HOST: 0.0.0.0
      YJS_PORT: 1234
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codecollab}
      DB_SSL: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "1234:1234"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5000}
        NEXT_PUBLIC_YJS_URL: ${NEXT_PUBLIC_YJS_URL:-ws://localhost:1234}
    depends_on:
      - backend
      - yjs
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  execution_data:
    name: ai-collaborative-code-editor_execution_data
